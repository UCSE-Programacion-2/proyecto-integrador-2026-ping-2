<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECNO X | Checkout</title>
  
  <!-- CDN de Bootstrap 5 (Estilos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Estilos del equipo -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- NAVBAR / ENCABEZADO -->
  <header class="encabezado-sitio sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent container-fluid px-4" style="max-width: var(--ancho-contenedor);">
      
      <!-- Logo -->
      <a class="navbar-brand fw-bold fs-3 text-uppercase text-decoration-none" href="../index.html" style="color: var(--color-acento);">
        TECNO X
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2 py-2 py-lg-0 text-center">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="../index.html" style="color: var(--color-texto-claro);">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="./catalogo.html" style="color: var(--color-texto-claro);">Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="./carrito.html" style="color: var(--color-texto-claro);">Carrito</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-semibold" aria-current="page" href="./checkout.html">Checkout</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold btn btn-sm btn-outline px-3 ms-lg-2 mt-2 mt-lg-0" href="./admin.html">Admin</a>
          </li>
        </ul>
      </div>

    </nav>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="min-vh-100 container py-5" style="max-width: var(--ancho-contenedor);">

    <h1 class="h2 fw-extrabold text-uppercase mb-4">Finalizar Compra</h1>

    <!-- Formulario General de Checkout -->
    <form id="form-checkout" class="needs-validation" novalidate>
      <div class="row g-4">
        
        <!-- COLUMNA IZQUIERDA: Formulario de Envío y Pago -->
        <div class="col-12 col-lg-8">
          
          <!-- Bloque 1: Datos Personales y de Envío -->
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
            <h2 class="h5 fw-bold text-uppercase mb-3 border-bottom pb-2">1. Datos de Envío</h2>
            
            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <label for="nombre" class="form-label small fw-semibold text-secondary">Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
              </div>
              
              <div class="col-12 col-sm-6">
                <label for="apellido" class="form-label small fw-semibold text-secondary">Apellido</label>
                <input type="text" class="form-control" id="apellido" required>
              </div>

              <div class="col-12 col-sm-6">
                <label for="email" class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
              </div>

              <div class="col-12 col-sm-6">
                <label for="telefono" class="form-label small fw-semibold text-secondary">Teléfono / Celular</label>
                <input type="tel" class="form-control" id="telefono" placeholder="388-1234567" required>
              </div>

              <div class="col-12 col-sm-8">
                <label for="direccion" class="form-label small fw-semibold text-secondary">Dirección (Calle y Número)</label>
                <input type="text" class="form-control" id="direccion" placeholder="Av. Fascio 100" required>
              </div>

              <div class="col-12 col-sm-4">
                <label for="piso" class="form-label small fw-semibold text-secondary">Piso / Dpto (Opcional)</label>
                <input type="text" class="form-control" id="piso">
              </div>

              <div class="col-12 col-sm-5">
                <label for="ciudad" class="form-label small fw-semibold text-secondary">Ciudad</label>
                <input type="text" class="form-control" id="ciudad" placeholder="San Salvador de Jujuy" required>
              </div>

              <div class="col-12 col-sm-4">
                <label for="provincia" class="form-label small fw-semibold text-secondary">Provincia</label>
                <select class="form-select" id="provincia" required>
                  <option value="Jujuy" selected>Jujuy</option>
                  <option value="Salta">Salta</option>
                  <option value="Tucumán">Tucumán</option>
                  <option value="Catamarca">Catamarca</option>
                  <option value="Santiago del Estero">Santiago del Estero</option>
                  <option value="Formosa">Formosa</option>
                  <option value="Chaco">Chaco</option>
                  <option value="Corrientes">Corrientes</option>
                  <option value="Misiones">Misiones</option>
                  <option value="Entre Rios">Entre Rios</option>
                  <option value="Santa Fe">Santa Fe</option>
                  <option value="Cordoba">Cordoba</option>
                  <option value="San Luis">San Luis</option>
                  <option value="La Rioja">La Rioja</option>
                  <option value="San Juan">San Juan</option>
                  <option value="Mendoza">Mendoza</option>
                  <option value="Neuquen">Neuquen</option>
                  <option value="La Pampa">La Pampa</option>
                  <option value="Buenos Aires">Buenos Aires</option>
                  <option value="Rio Negro">Rio Negro</option>
                  <option value="Chubut">Chubut</option>
                  <option value="Santa Cruz">Santa Cruz</option>
                  <option value="Tierra del Fuego">Tierra del Fuego</option>
                  
                </select>
              </div>

              <div class="col-12 col-sm-3">
                <label for="codigoPostal" class="form-label small fw-semibold text-secondary">Código Postal</label>
                <input type="text" class="form-control" id="codigoPostal" placeholder="4600" required>
              </div>
            </div>
          </div>

          <!-- Bloque 2: Método de Pago -->
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <h2 class="h5 fw-bold text-uppercase mb-3 border-bottom pb-2">2. Método de Pago</h2>
            
            <div class="my-3">
              <!-- Opción 1: Mercado Pago / Tarjetas -->
              <div class="form-check mb-3 p-3 border rounded-3 bg-light">
                <input id="mercadoPago" name="metodoPago" type="radio" class="form-check-input ms-0 me-3" checked required>
                <label class="form-check-label fw-bold text-dark" for="mercadoPago">
                  Mercado Pago / Tarjetas de Crédito y Débito
                </label>
              </div>

              <!-- Opción 2: Transferencia Bancaria -->
              <div class="form-check p-3 border rounded-3 bg-light">
                <input id="transferencia" name="metodoPago" type="radio" class="form-check-input ms-0 me-3" required>
                <label class="form-check-label fw-bold text-dark" for="transferencia">
                  Transferencia Bancaria
                </label>
              </div>
            </div>
          </div>

        </div>

        <!-- COLUMNA DERECHA: Resumen del Pedido -->
        <div class="col-12 col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-lg-top" style="top: 100px; z-index: 10;">
            <h2 class="h5 fw-bold text-uppercase mb-3 border-bottom pb-2">Resumen del Pedido</h2>
            
            <!-- Lista de productos en el carrito -->
            <!-- Items generados por js/cart.js -->
            <ul id="checkout-items" class="list-group list-group-flush mb-3"></ul>

            <!-- Desglose de costos -->
            <div class="border-top pt-3">
              <div class="d-flex justify-content-between mb-2 small text-secondary">
                <span>Subtotal</span>
                <span id="checkout-subtotal">$0</span>
              </div>
              <div class="d-flex justify-content-between mb-2 small text-secondary">
                <span>Envío (Jujuy)</span>
                <span class="text-success fw-semibold">Gratis</span>
              </div>
              <hr class="my-2">
              <div class="d-flex justify-content-between mb-4">
                <span class="fw-bold text-dark text-uppercase">Total</span>
                <strong id="checkout-total" class="text-primary h4 mb-0">$0</strong>
              </div>
            </div>

            <!-- Botón definitivo de envío -->
            <button class="btn btn-warning btn-lg w-100 fw-bold text-uppercase shadow-sm py-2" type="submit">
              Confirmar y Pagar
            </button>
            
            <div class="text-center mt-3">
              <a href="./catalogo.html" class="text-decoration-none small fw-semibold">Volver al Catálogo</a>
            </div>
          </div>
        </div>

      </div>
    </form>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="pie-sitio mt-auto py-4 shadow-lg border-top border-dark">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3" style="max-width: var(--ancho-contenedor);">
      <p class="mb-0 fw-medium">&copy; 2026 <span class="fw-bold text-uppercase" style="color: var(--color-acento);">TECNO X</span> - Tecnología en Jujuy</p>
      
      <div class="d-flex gap-3 fs-6">
        <a href="./catalogo.html" class="text-decoration-none">Tienda</a>
        <span class="text-secondary">|</span>
        <a href="./carrito.html" class="text-decoration-none">Mi Carrito</a>
      </div>
    </div>
  </footer>

  <!-- CDN de Bootstrap 5 (Scripts) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="../js/cart.js"></script>
  <script type="module" src="../js/navbar.js"></script>
</body>
</html>
