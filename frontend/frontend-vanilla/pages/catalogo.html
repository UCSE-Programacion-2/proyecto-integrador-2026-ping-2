<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TECNO X | Catalogo</title>

    <!-- CDN de Bootstrap 5 (Estilos) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Estilos del equipo (Notar el ../ para salir de la carpeta pages) -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Bootstrap Icons para los filtros -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- NAVBAR / ENCABEZADO -->
    <header class="encabezado-sitio sticky-top shadow-sm">
      <nav
        class="navbar navbar-expand-lg navbar-dark bg-transparent container-fluid px-4"
        style="max-width: var(--ancho-contenedor)"
      >
        <!-- Logo -->
        <a
          class="navbar-brand fw-bold fs-3 text-uppercase text-decoration-none"
          href="../index.html"
          style="color: var(--color-acento)"
        >
          TECNO X
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav gap-2 py-2 py-lg-0 text-center">
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="../index.html"
                style="color: var(--color-texto-claro)"
                >Inicio</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="./catalogo.html"
                style="color: var(--color-texto-claro)"
                >Catálogo</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="./carrito.html"
                style="color: var(--color-texto-claro)"
                >Carrito</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="./checkout.html"
                style="color: var(--color-texto-claro)"
                >Checkout</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold btn btn-sm btn-outline px-3 ms-lg-2 mt-2 mt-lg-0"
                href="./admin.html"
                >Admin</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Contenedor en fila para Filtros + Productos -->
    <main class="min-vh-100 container py-5" style="max-width: var(--ancho-contenedor)">
      <div class="row g-4">
        <!-- 1. FILTROS LATERALES (manejados por js/products.js) -->
        <aside class="col-12 col-lg-3">
          <div
            class="card border-0 shadow-sm rounded-4 p-4 sticky-lg-top"
            style="top: 90px; z-index: 10"
          >
            <h2 class="h5 fw-bold text-uppercase mb-3">
              <i class="bi bi-funnel-fill me-2"></i>Filtros
            </h2>
            <hr class="text-muted" />

            <!-- Filtro por Categorías (generado por js/products.js con las categorías de la BD) -->
            <div class="mb-4">
              <h3 class="h6 fw-bold text-uppercase text-secondary mb-2">Categorías</h3>
              <div id="filtro-categorias">
                <p class="small text-muted mb-0">Cargando categorías...</p>
              </div>
            </div>

            <!-- Filtro por Precio Máximo -->
            <div class="mb-4">
              <h3 class="h6 fw-bold text-uppercase text-secondary mb-2">Precio Máximo</h3>
              <label id="label-precio" for="rango-precio" class="form-label small text-muted"
                >Hasta: $1.000.000</label
              >
              <input
                type="range"
                class="form-range"
                min="0"
                max="1000000"
                step="10000"
                value="1000000"
                id="rango-precio"
              />
            </div>

            <button id="btn-limpiar-filtros" type="button" class="btn btn-outline-dark btn-sm w-100 rounded-3">
              Limpiar Filtros
            </button>
          </div>
        </aside>

        <!-- 2. SECCIÓN DE PRODUCTOS (Criterio de Aceptación) -->
        <section class="col-12 col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <p id="contador-productos" class="text-muted mb-0">Cargando productos...</p>
            <select
              id="orden-productos"
              class="form-select form-select-sm rounded-3"
              style="width: auto"
              aria-label="Ordenar productos"
            >
              <option value="destacados">Ordenar por: Destacados</option>
              <option value="precio-asc">Precio: Menor a Mayor</option>
              <option value="precio-desc">Precio: Mayor a Menor</option>
            </select>
          </div>

          <!-- Grilla responsiva de productos (generada por js/products.js) -->
          <div id="lista-productos" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
            <p class="text-muted text-center w-100 py-5">Cargando productos...</p>
          </div>
          <!-- Cierre grilla -->
        </section>
        <!-- Cierre seccion de productos -->
      </div>
      <!-- Cierre contenedor fila -->
    </main>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="pie-sitio mt-auto py-4 shadow-lg border-top border-dark">
      <div
        class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3"
        style="max-width: var(--ancho-contenedor)"
      >
        <p class="mb-0 fw-medium">
          &copy; 2026
          <span class="fw-bold text-uppercase" style="color: var(--color-acento)">TECNO X</span> -
          Tecnología en Jujuy
        </p>

        <div class="d-flex gap-3 fs-6">
          <a href="./catalogo.html" class="text-decoration-none">Tienda</a>
          <span class="text-secondary">|</span>
          <a href="./carrito.html" class="text-decoration-none">Mi Carrito</a>
        </div>
      </div>
    </footer>

    <!-- CDN de Bootstrap 5 (Scripts) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../js/products.js"></script>
    <script type="module" src="../js/navbar.js"></script>
  </body>
</html>
