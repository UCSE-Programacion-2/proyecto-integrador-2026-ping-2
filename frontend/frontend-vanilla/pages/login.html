<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECNO X | Iniciar sesión</title>
  
  <!-- CDN de Bootstrap 5 (Estilos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Estilos del equipo (Notar el ../ para salir de la carpeta pages) -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- NAVBAR / ENCABEZADO -->
  <header class="encabezado-sitio sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent container-fluid px-4" style="max-width: var(--ancho-contenedor);">
      
      <!-- Logo -->
      <a class="navbar-brand fw-bold fs-3 text-uppercase text-decoration-none" href="../index.html" style="color: var(--color-acento);">
        TECNO X
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2 py-2 py-lg-0 text-center">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="../index.html" style="color: var(--color-texto-claro);">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="./catalogo.html" style="color: var(--color-texto-claro);">Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="./carrito.html" style="color: var(--color-texto-claro);">Carrito</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="./checkout.html" style="color: var(--color-texto-claro);">Checkout</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold btn btn-sm btn-outline px-3 ms-lg-2 mt-2 mt-lg-0" href="./admin.html">Admin</a>
          </li>
        </ul>
      </div>

    </nav>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="min-vh-100 container py-5" style="max-width: var(--ancho-contenedor);">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h1 class="h3 fw-bold text-uppercase text-center mb-4">Iniciar sesión</h1>

          <div id="mensaje-auth" class="alert d-none" role="alert"></div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold text-uppercase">Ingresar</button>
          </form>

          <p class="text-center small mt-4 mb-0">
            ¿No tenés cuenta? <a href="./registro.html" class="fw-semibold">Registrate</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- PIE DE PÁGINA (FOOTER) -->
  <footer class="pie-sitio mt-auto py-4 shadow-lg border-top border-dark">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3" style="max-width: var(--ancho-contenedor);">
      <p class="mb-0 fw-medium">&copy; 2026 <span class="fw-bold text-uppercase" style="color: var(--color-acento);">TECNO X</span> - Tecnología en Jujuy</p>
      
      <div class="d-flex gap-3 fs-6">
        <a href="./catalogo.html" class="text-decoration-none">Tienda</a>
        <span class="text-secondary">|</span>
        <a href="./carrito.html" class="text-decoration-none">Mi Carrito</a>
      </div>
    </div>
  </footer>

  <!-- CDN de Bootstrap 5 (Scripts) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/navbar.js"></script>
</body>
</html>
